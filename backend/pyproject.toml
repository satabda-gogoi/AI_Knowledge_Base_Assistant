[project]
name = "ai-knowledge-base-assistant"
version = "1.0.0"
description = "Cloud-ready RAG Knowledge Base Assistant built with FastAPI, LangChain, Gemini, and Qdrant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.34",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.0",
    "aiosqlite>=0.22.0",
    "langchain>=1.5.0",
    "langchain-core>=1.8.0",
    "langchain-text-splitters>=1.2.0",
    "langchain-google-genai>=4.5.0",
    "langchain-qdrant>=1.2.0",
    "qdrant-client>=1.15.1",
    "pypdf>=7.1.0",
    "python-docx>=1.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
