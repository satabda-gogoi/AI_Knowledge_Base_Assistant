services:
  backend:
    build:
      context: ./backend
    container_name: rag-kb-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-2.5-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      QDRANT_PATH: /app/data/qdrant_db
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-knowledge_base}
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      SQLITE_DB_PATH: /app/data/app.db
      UPLOAD_DIR: /app/data/uploads
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    volumes:
      - kb_data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    container_name: rag-kb-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  kb_data:
